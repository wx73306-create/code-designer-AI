# ============================================================================
# Nginx Config for CodeDesignerAI.com
# Windows Server 2022 + Next.js 3000
# Usage: Put this in nginx\conf\nginx.conf after installing Nginx
#
# 【仅用 IP 访问时无需 Nginx】
# 若暂时通过 http://150.158.27.120:3000 直接访问（腾讯云安全组 + Windows 防火墙放行 3000），
# 可以跳过 Nginx，直接用 :3000 端口。下方配置是给"绑定域名 + HTTPS"时用的。
# 用域名时把 server_name 改成你的域名，并把 SSL 证书放到 C:/deploy/ssl/。
# ============================================================================

# Redirect HTTP -> HTTPS
server {
    listen 80;
    server_name codedesignerai.cn www.codedesignerai.cn;
    return 301 https://$host$request_uri;
}

# HTTPS reverse proxy to Next.js
server {
    listen 443 ssl http2;
    server_name codedesignerai.cn www.codedesignerai.cn;

    # SSL certificates (Let's Encrypt)
    ssl_certificate     C:/deploy/ssl/fullchain.pem;
    ssl_certificate_key C:/deploy/ssl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1024;

    # Static assets cache
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    # SSE endpoint — disable buffering for real-time push
    location /api/admin/live {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # All other requests -> Next.js
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeout for long AI requests (vision analysis, code generation)
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
